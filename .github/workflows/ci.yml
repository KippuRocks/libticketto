name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint, test, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # T-002-02: the SDK's error codes and invariant ids are generated from the
      # vendored spec/SPEC.md; a spec change not yet regenerated fails here.
      - run: pnpm spec:check
      # T-002-10 — features/002-sdk/plan.md §6: the SDK's exported surface (C1, C8)
      # is checked in as packages/sdk/api/sdk.api.md. A surface change that does
      # not update the report fails here; acknowledge it with `pnpm api:update`.
      - run: pnpm api:check
      - run: pnpm typecheck
      - run: pnpm lint
      # T-002-09 — features/002-sdk/plan.md §5.6: no switch over Command kinds or
      # TickettoErrorCode without a default, so beyond-V0 additions never break
      # a consumer. Biome cannot see types; tools/switch-default checks it.
      - run: pnpm lint:switches
      - run: pnpm test
      - run: pnpm boundaries

  hermes:
    # features/001-workspace/plan.md §5.3: sdk, profile-v0 and binding-offchain
    # run inside React Native apps, so a Node-only API on that path must fail
    # here, at the commit that introduces it.
    name: Hermes bundle (sdk, profile-v0, binding-offchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundle with Metro and compile with hermesc
        run: pnpm hermes
      - name: Self-test — a Node-only API in sdk must fail the bundle
        run: pnpm vitest run --project @libticketto/hermes-bundle

  hermes-run:
    # features/003-profile-v0/plan.md §7: the profile's portable suites run on
    # Node (Vitest) and here, under the Hermes VM, from bytecode compiled by the
    # hermesc React Native ships. The VM is built once from the matching
    # facebook/hermes release and cached.
    name: Hermes run (profile-v0 suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: hermes
        working-directory: packages/profile-v0
        run: echo "version=$(node -p 'require("hermes-compiler/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/hermes-vm
          key: hermes-vm-${{ runner.os }}-${{ steps.hermes.outputs.version }}
      - name: Build the Hermes VM (skipped when cached)
        run: |
          if [ ! -x ~/.cache/hermes-vm/bin/hermes ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build libicu-dev
          fi
          packages/profile-v0/test/hermes/build-vm.sh ~/.cache/hermes-vm
      - run: HERMES_VM="$HOME/.cache/hermes-vm/bin/hermes" pnpm --filter @ticketto/profile-v0 test:hermes
      # T-003-09: pass size and verification time on Node and Hermes, printed
      # for the benchmark report. Informational; a pass that fails to verify fails.
      - name: Pass benchmark (Node, Hermes)
        run: |
          set -o pipefail
          pnpm --filter @ticketto/profile-v0 bench | grep -o 'BENCH {.*'
          HERMES_VM="$HOME/.cache/hermes-vm/bin/hermes" pnpm --filter @ticketto/profile-v0 bench:hermes | grep -o 'BENCH {.*'

  canary:
    # T-001-07: a Changesets snapshot of every @ticketto/* package, packed with
    # `pnpm pack` and installed into a throwaway client outside the workspace,
    # where each package is imported and typechecked by name. Nothing is
    # published.
    #
    # Normally about half a minute. Each step inside the tool has its own bound
    # and fails naming the step; this bounds the job as a whole.
    name: Canary release installs in a client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm canary

  # T-001-08 — REQ-SDK-7, NFR-8: the conformance suite runs once per registered
  # backend package. A backend registers by defining a `conformance` script
  # (tools/conformance-matrix). With zero registered backends the matrix is
  # skipped and the `Conformance` check passes, reporting zero; once any are
  # registered, a failure in any of them turns `Conformance` red.
  conformance-discover:
    name: Conformance — discover backends
    runs-on: ubuntu-latest
    outputs:
      backends: ${{ steps.discover.outputs.backends }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @libticketto/conformance-matrix build
      - id: discover
        run: pnpm conformance-matrix discover

  conformance-backend:
    name: Conformance — ${{ matrix.backend }}
    needs: conformance-discover
    if: needs.conformance-discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.conformance-discover.outputs.backends) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm conformance-matrix run "${{ matrix.backend }}"

  conformance:
    name: Conformance
    needs: [conformance-discover, conformance-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @libticketto/conformance-matrix build
      - run: >-
          pnpm conformance-matrix verdict
          "${{ needs.conformance-discover.result }}"
          "${{ needs.conformance-discover.outputs.count || 0 }}"
          "${{ needs.conformance-backend.result }}"
